# Generated by `bin/prism-legal api sync` from `src/Application.lex.tex` (`tools/case/presentationmodel.py`).
# Do not edit by hand: `bin/prism-legal check` verifies zero drift.
name: Deploy PrismLegal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  view:
    name: Render & Verify Portal View Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the portal view artifacts
        run: ./bin/prism-legal view render --out view

      - name: Run Zero-PII & Static Conformance Gate
        run: |
          ./bin/prism-legal sanitize
          ./bin/prism-legal check

      - name: Upload view artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-legal-current-view
          path: view

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: view

  deploy:
    name: Deploy to GitHub Pages
    needs: view
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the rendered view to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify Deployed Page Serves Commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Fetch deployed page and verify embedded commit SHA
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$PAGE_URL" | grep -qF "\"commit\": \"$GITHUB_SHA\""; then
              echo "$PAGE_URL serves commit $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "$PAGE_URL did not yet reflect commit $GITHUB_SHA" >&2
          exit 1

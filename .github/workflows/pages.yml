# Generated by `bin/prism-legal api sync` from `src/Application.lex.tex` (`tools/case/presentationmodel.py`).
# Do not edit by hand: `bin/prism-legal check` verifies zero drift.
name: Deploy PrismLegal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  view:
    name: Compile and Verify Modeled Matter Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify the modeled matter workspace
        uses: ./.github/actions/build-matter

      - name: Upload view artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-legal-current-view
          path: matter-site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: matter-site

  deploy:
    name: Deploy to GitHub Pages
    needs: view
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the rendered view to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify Deployed Modeled Artifact
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prism-legal-current-view
          path: expected-view
      - name: Compare deployed provenance with this run's verified artifact
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "${PAGE_URL%/}/provenance.json" --output deployed-provenance.json &&                cmp --silent expected-view/provenance.json deployed-provenance.json; then
              echo "$PAGE_URL serves the verified modeled artifact"
              exit 0
            fi
            sleep 10
          done
          echo "$PAGE_URL does not yet serve the verified modeled artifact" >&2
          exit 1

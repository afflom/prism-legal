# Generated by `bin/prism-legal api sync` from `src/Application.lex.tex` (`tools/case/presentationmodel.py`).
# Do not edit by hand: `bin/prism-legal check` verifies zero drift.
name: Main Branch Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Sanitize, Check & Render Portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Zero-PII & Case-Sanitization Gate
        run: ./bin/prism-legal sanitize

      - name: Run Static, Schema & Model Sync Checks
        run: |
          ./bin/prism-legal api check
          ./bin/prism-legal check

      - name: Verify Inference & Discovery Engines
        run: |
          ./bin/prism-legal engine
          ./bin/prism-legal discover
          ./bin/prism-legal convert

# PrismPM Intake Classifiers & Per-Node Attention Heads (src/Intake.lex.tex)
spec = "prism-legal/intake/1"
feature_dim = 8
max_channel = 255
num_domain_classes = 6

[[feature_channel]]
index = 0
id = "ch-family-custody"
label = "Parenting, Custody & Support Signal"
keywords = ["parenting", "custody", "overnight", "overnights", "child", "children", "dependent", "dependents", "school", "decision-making", "50/50", "support", "coparenting", "visitation", "parent", "guardian", "best interests", "402", "305"]

[[feature_channel]]
index = 1
id = "ch-housing-habitability"
label = "Housing, Lease & Habitability Signal"
keywords = ["tenant", "landlord", "lease", "rent", "habitability", "eviction", "mold", "heat", "heating", "plumbing", "code", "inspection", "escrow", "abatement", "apartment", "premises", "retaliatory", "urlta", "repair"]

[[feature_channel]]
index = 2
id = "ch-veterans-disability"
label = "Veterans Benefits & Disability Rating Signal"
keywords = ["veteran", "veterans", "va", "tdiu", "service-connected", "rating", "38 cfr", "bva", "nexus", "tinnitus", "lumbar", "unemployability", "c-file", "dbq", "benefit", "1781", "disability", "schedular"]

[[feature_channel]]
index = 3
id = "ch-employment-ada"
label = "Employment, ADA & Workplace Retaliation Signal"
keywords = ["employment", "employer", "employee", "workplace", "ada", "accommodation", "ergonomic", "remote", "hr", "retaliation", "termination", "pip", "eeoc", "title vii", "fmla", "wage", "overtime", "interactive process"]

[[feature_channel]]
index = 4
id = "ch-commercial-ucc"
label = "Commercial Contract, Consumer & UCC Signal"
keywords = ["commercial", "contract", "ucc", "buyer", "seller", "goods", "shipment", "delivery", "nonconforming", "rejection", "revocation", "cure", "warranty", "invoice", "purchase order", "breach", "cover", "fdcpa", "validation", "debt"]

[[feature_channel]]
index = 5
id = "ch-fiduciary-governance"
label = "Business Governance & Fiduciary Accounting Signal"
keywords = ["fiduciary", "member", "llc", "corporation", "shareholder", "partner", "partnership", "dgcl", "books and records", "220", "accounting", "buyout", "diversion", "operating agreement", "board", "distribution", "k-1"]

[[feature_channel]]
index = 6
id = "ch-corroboration-density"
label = "Multi-Modal Documentary, Visual & Cryptographic Corroboration Density"
keywords = ["exhibit", "certified", "bank", "tax", "ledger", "photo", "photograph", "image", "video", "audio", "pdf", "csv", "scan", "handwritten", "badge", "sha256", "statement", "receipt", "log", "email", "letter", "report", "stipulated", "contract", "notice", "medical", "record", "affidavit", "transcript", "upload"]

[[feature_channel]]
index = 7
id = "ch-impeachment-completeness"
label = "Impeachment, Completeness Context & Procedural Filing Urgency Signal"
keywords = ["omission", "undisclosed", "contradiction", "inconsistent", "selective", "excerpt", "completeness", "106", "608", "613", "26(e)", "16.2", "rebuttal", "allegation", "disputed", "hostile", "impeach", "escrow", "deadline", "filing", "motion", "subpoena", "pretrial", "timely"]

[[schema_classifier]]
id = "schema-case-meta"
schema_element = "caseMeta"
title = "Case Front Matter & Jurisdiction Classifier"
head_id = "HEAD-01"
classes = ["DOM-FAM-103", "DOM-HOU-URLTA", "DOM-VET-38CFR", "DOM-EMP-ADA", "DOM-COM-UCC", "DOM-BIZ-DGCL"]
extrapolation_target = "Infers governing legal framework and statutory authority strictly from non-empty user intake tokens."

[[schema_classifier]]
id = "schema-relief-goal"
schema_element = "reliefGoals"
title = "Relief Goals & Requested Judicial Orders Classifier"
head_id = "HEAD-02"

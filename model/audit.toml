statutory_anchor = "38 U.S.C. \u00a7 1781 & Support Guidelines \u00a7 305(10)"
pillar_id = "OS-5"
opening_aligned_pivot = "Through my statutory retirement benefit package, all three minor children have comprehensive medical and dental coverage at $0 monthly premium (Ex-E, Ex-N)."
rebuttal_exhibits = ["Ex-E", "Ex-N"]

[[trap]]
id = "TRAP-09"

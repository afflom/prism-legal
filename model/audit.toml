[[trap]]
id = "TRAP-01"
title = "Pre-Separation Household Disagreements & Audio Clips (Spring 2029)"
statutory_anchor = "Uniform Best-Interests \u00a7 402(a)(5)-(6) & FRE 106"
pillar_id = "OS-1"
opening_aligned_pivot = "I take full responsibility for my share of pre-separation household stress; since separating nine months ago we have had zero incidents, and I completed the Collaborative Seminar 30 days ahead of schedule (Ex-M, Ex-O)."
rebuttal_exhibits = ["Ex-K", "Ex-M", "Ex-O"]

[[trap]]
id = "TRAP-02"
title = "Dismissed Interim Administrative Petition (Oct 2029)"
statutory_anchor = "State Protection Statute & Uniform \u00a7 402(b)"
pillar_id = "OS-4"
opening_aligned_pivot = "That interim petition was dismissed by joint stipulation on November 18, 2029 with zero findings (Ex-J), and we have had nine incident-free months of structured co-parenting since."
rebuttal_exhibits = ["Ex-A", "Ex-J", "Ex-O"]

[[trap]]
id = "TRAP-03"
title = "Alleged School Transit Corridor Proximity & Telemetry Log"
statutory_anchor = "FRE 901(b)(9) & State Protection Statute"
pillar_id = "OS-4"
opening_aligned_pivot = "Verified transit telemetry (Ex-A) proves I remained 512 yards away on the public arterial boulevard and complied strictly with the 500-yard buffer."
rebuttal_exhibits = ["Ex-A", "Ex-J"]

[[trap]]
id = "TRAP-04"
title = "Speculative $14,000/mo Income Imputation on Retired Pensioner"
statutory_anchor = "Uniform Support Guidelines \u00a7 305(5)(b)"
pillar_id = "OS-5"
opening_aligned_pivot = "As the Court recognized at Temporary Orders (Ex-N \u00b6 15), I have a certified full disability retirement determination (Ex-E), and the guidelines prohibit imputing speculative wages on top of verified disability benefits."
rebuttal_exhibits = ["Ex-D", "Ex-E", "Ex-F", "Ex-N"]

[[trap]]
id = "TRAP-05"
title = "Unpaid Civic Curriculum Research Mischaracterized as Commercial Consulting"
statutory_anchor = "IRC \u00a7 61 & Support Guidelines \u00a7 305"
pillar_id = "OS-3"
opening_aligned_pivot = "Certified IRS transcripts from 2026 through 2029 (Ex-C, Ex-D) confirm $0.00 in consulting revenue, wages, or distributions; self-paced civic writing at home leaves me 100% available for all three minor children."
rebuttal_exhibits = ["Ex-C", "Ex-D", "Ex-E"]

[[trap]]
id = "TRAP-06"
title = "Retroactive Nov 2029\u2013May 2030 Expense Demand vs. $30,000.00 Escrow Omission"
statutory_anchor = "FRCP 26(e) / Mandatory Disclosure Rule 16.2(e)(10)"
pillar_id = "OS-6"
opening_aligned_pivot = "At Temporary Orders (Ex-N \u00b6\u00b6 24-26), the Court held that stipulation unconscionable because $30,000.00 in escrow accounts (Ex-H) had been omitted from the initial Sworn Financial Statement (Ex-G)."
rebuttal_exhibits = ["Ex-G", "Ex-H", "Ex-J", "Ex-N"]

[[trap]]
id = "TRAP-07"
title = "Commercial $2,400/mo After-School Agency Demand vs. Free Parental Care"
statutory_anchor = "Uniform Support Guidelines \u00a7 305(9) & \u00a7 402(a)"
pillar_id = "OS-3"
opening_aligned_pivot = "Because of my retirement schedule, I am available full-time to care for the three children during every regional travel week for $0, rather than placing them with a commercial agency."
rebuttal_exhibits = ["Ex-E", "Ex-L", "Ex-N"]

[[trap]]
id = "TRAP-08"

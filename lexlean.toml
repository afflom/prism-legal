spec = "lexlean/project/1"
name = "prism-legal"
language = "1.2"
module_prefix = "PrismLegal"
source_roots = ["src", "stdlib"]
entrypoints = ["src/Api.lex.tex", "src/Application.lex.tex", "src/Architecture.lex.tex", "src/Audit.lex.tex", "src/Convert.lex.tex", "src/DirectExam.lex.tex", "src/Discovery.lex.tex", "src/Engine.lex.tex", "src/Intake.lex.tex", "src/LegalMeta.lex.tex", "src/Observer.lex.tex", "src/Portal.lex.tex", "src/Presentation.lex.tex", "src/Register.lex.tex", "src/RemediesCore.lex.tex", "src/Sequences.lex.tex", "src/Standards.lex.tex", "src/VisualEvidence.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.int"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[[lexicon_source]]
package = "prism.legal"
kind = "path"
path = "language/prism.legal"

[[lexicon_source]]
package = "prism.qual"
kind = "path"
path = "language/prism.qual"

[[lexicon_source]]
package = "prism.sec"
kind = "path"
path = "language/prism.sec"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 600000

